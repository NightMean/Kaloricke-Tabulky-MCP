# Optional Cloudflare Tunnel deployment with Docker Compose.
# Configure credentials in .env, then run from the repository root:
#
#   docker compose -p kt-mcp --env-file .env -f deploy/stack.yml pull
#   docker compose -p kt-mcp --env-file .env -f deploy/stack.yml up -d
#
# Keep -p kt-mcp stable so saved OAuth state is reused across deployments.
#
# Secrets (KT_EMAIL, KT_PASSWORD, MCP_AUTH_PASSWORD, PUBLIC_URL, MCP_HOSTNAME,
# TUNNEL_TOKEN) come from .env — never from this file.
#
# Request path:
#   Cloudflare  →  cloudflared (host network)  →  127.0.0.1:80  →  nginx  →  kt-mcp:8092
#
# cloudflared dials out to Cloudflare, so no inbound port is opened on the host
# or the router. nginx publishes on loopback only, because the tunnel is
# configured to reach http://localhost:80.
services:
  kt-mcp:
    image: ghcr.io/nightmean/kaloricke-tabulky-mcp:latest
    container_name: kaloricke-tabulky-mcp
    restart: unless-stopped
    environment:
      KT_EMAIL: ${KT_EMAIL}
      KT_PASSWORD: ${KT_PASSWORD}
      KT_DOMAIN: ${KT_DOMAIN:-}
      KT_BASE_URL: ${KT_BASE_URL:-}
      MCP_AUTH_PASSWORD: ${MCP_AUTH_PASSWORD}
      PUBLIC_URL: ${PUBLIC_URL}
      PORT: 8092
      STATE_DIR: /data
    volumes:
      - kt-mcp-state:/data
    networks:
      - default
    # No `ports:` — only nginx talks to this, over the stack's internal network.

  nginx:
    image: nginx:alpine
    container_name: kt-mcp-nginx
    restart: unless-stopped
    environment:
      # Substituted into the template at container start.
      MCP_HOSTNAME: ${MCP_HOSTNAME}
      # Without this filter envsubst would also eat nginx's own $variables
      # ($host, $remote_addr, …) and produce an empty, silently broken config.
      NGINX_ENVSUBST_FILTER: '^MCP_'
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    # Loopback only: the tunnel is the sole way in from outside.
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - kt-mcp
    networks:
      - default

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: kt-mcp-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    # Host network so the tunnel's configured origin, http://localhost:80,
    # resolves to nginx's loopback publication rather than to this container.
    network_mode: host
    depends_on:
      - nginx

volumes:
  kt-mcp-state:

networks:
  default:
