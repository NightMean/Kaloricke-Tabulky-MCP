# Run the configured image with Docker Compose and an existing HTTPS proxy.
# `docker compose build` builds a local image; deploy/stack.yml adds a tunnel.
services:
  kt-mcp:
    image: ${KT_MCP_IMAGE:-kt-mcp:latest}
    build: .
    environment:
      KT_EMAIL: ${KT_EMAIL}
      KT_PASSWORD: ${KT_PASSWORD}
      KT_DOMAIN: ${KT_DOMAIN:-}
      KT_BASE_URL: ${KT_BASE_URL:-}
      MCP_AUTH_PASSWORD: ${MCP_AUTH_PASSWORD}
      PUBLIC_URL: ${PUBLIC_URL}
      PORT: 8092
      STATE_DIR: /data
    volumes:
      - kt-mcp-state:/data
    # Bound to loopback for a local HTTPS reverse proxy or tunnel.
    ports:
      - "127.0.0.1:8092:8092"

volumes:
  kt-mcp-state:
