name: Verify or publish release

on:
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish Docker images and the compiled GitHub release package
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: distribution
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      image: ${{ steps.metadata.outputs.image }}
      tags: ${{ steps.metadata.outputs.tags }}
    steps:
      - name: Require main for publication
        if: inputs.publish_image && github.ref != 'refs/heads/main'
        run: echo 'Publication must run from main' >&2; exit 1
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run test:package
      - id: metadata
        name: Read package identity
        run: |
          version=$(node -p 'require("./package.json").version')
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "version=$version"
            echo "image=$image"
            echo 'tags<<EOF'
            echo "$image:$version"
            echo "$image:v$version"
            echo "$image:sha-$GITHUB_SHA"
            if [[ "$version" != *-* ]]; then echo "$image:latest"; fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Build native image
        run: docker build -t kt-mcp:verification .
      - name: Check container HTTP startup and authentication
        run: |
          trap 'docker logs kt-mcp-verification; docker rm -fv kt-mcp-verification' EXIT
          docker run -d --name kt-mcp-verification -p 127.0.0.1:18092:8092 \
            -e KT_EMAIL=fixture@example.invalid -e KT_PASSWORD=fixture-password \
            -e PUBLIC_URL=https://distribution.example.invalid \
            -e MCP_AUTH_PASSWORD=fixture-consent-password kt-mcp:verification
          curl --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 --fail http://127.0.0.1:18092/healthz
          test "$(curl --max-time 5 -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18092/mcp)" = 401
      - name: Check Docker stdio tool discovery
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { Client } from '@modelcontextprotocol/sdk/client/index.js';
          import { StdioClientTransport } from '@modelcontextprotocol/sdk/client/stdio.js';
          const client = new Client({ name: 'docker-acceptance', version: '0.0.0' });
          const transport = new StdioClientTransport({ command: 'docker', args: [
            'run', '--rm', '-i', '-e', 'KT_EMAIL', '-e', 'KT_PASSWORD',
            'kt-mcp:verification', 'node', 'dist/cli.js',
          ], env: { KT_EMAIL: 'fixture@example.invalid', KT_PASSWORD: 'fixture-password' } });
          try {
            await client.connect(transport);
            assert.equal((await client.listTools()).tools.length, 48);
          } finally { await client.close(); }
          JS

  image:
    if: inputs.publish_image && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check locked runtime dependencies before publication
        run: npm audit --omit=dev --audit-level=high
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ needs.verify.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}

  release:
    if: inputs.publish_image && github.ref == 'refs/heads/main'
    needs: [verify, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Create compiled release asset
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts
          mv "artifacts/kaloricke-tabulky-mcp-$RELEASE_VERSION.tgz" artifacts/kaloricke-tabulky-mcp.tgz
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          cat > artifacts/release-notes.md <<'NOTES'
          ## Installation
          - Local MCP: run the compiled release archive with npx; Node.js 22+ is required. No Docker or npm account is needed.
          - Self-hosting: Docker Compose uses the public GHCR image with the latest stable tag by default.

          ## Included
          - The same 48 diary, recipe, activity and nutrition tools over native stdio and OAuth-protected HTTP.
          - Compiled CLI package, multi-platform Docker images and security-patched runtime dependencies.

          See the README and setup guides for credentials and client configuration.
          NOTES
          gh release create "v$RELEASE_VERSION" artifacts/kaloricke-tabulky-mcp.tgz \
            --target "$GITHUB_SHA" --title "v$RELEASE_VERSION" --notes-file artifacts/release-notes.md
